[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "deepa-lm"
version = "2026.11.23"
description = "DEEPA: hybrid gated-delta-rule / ALiBi-attention language models with constant-size recurrent state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Deepa" }, { name = "J. V. K. Hem" }, { name = "M. A. Shriram" }]
keywords = ["language-model", "linear-attention", "delta-rule", "alibi", "pytorch", "transformers", "state-space"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.2", "safetensors>=0.4"]

[project.urls]
Homepage = "https://github.com/mashriram/deepa"
Repository = "https://github.com/mashriram/deepa"
Issues = "https://github.com/mashriram/deepa/issues"

[project.optional-dependencies]
fast = ["flash-linear-attention>=0.2", "triton>=3.0"]   # Triton gated-delta-rule kernels (CUDA)
hf = ["transformers>=4.45"]
diffusers = ["diffusers>=0.30"]
dev = ["pytest>=8", "transformers>=4.45", "diffusers>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/deepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
